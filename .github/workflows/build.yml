name: Build VCV Rack Plugin

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Linux runners need OpenGL/X11 dev headers so Rack deps (GLEW) can build,
      # and JACK headers so Rack deps (rtmidi) can build.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libjack-jackd2-dev

      - name: Clone Rack
        run: |
          git clone --recursive https://github.com/VCVRack/Rack.git rack

      # Builds Rack dependencies into rack/dep (includes jansson.h, etc.)
      - name: Build Rack dependencies
        run: |
          make -C rack dep

      - name: Build plugin
        run: |
          export RACK_DIR=$PWD/rack
          make
