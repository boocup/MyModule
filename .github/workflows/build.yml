name: Build VCV Rack Plugin

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Linux: OpenGL/X11 + audio deps needed to build Rack's dep tree
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libjack-jackd2-dev \
            libasound2-dev \
            libpulse-dev

      # Windows: Rack dep build uses wget
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm wget

      - name: Clone Rack
        run: |
          git clone --recursive https://github.com/VCVRack/Rack.git rack

      # Builds Rack dependencies into rack/dep
      - name: Build Rack dependencies
        run: |
          make -C rack dep

      - name: Build plugin
        run: |
          export RACK_DIR=$PWD/rack
          make
