name: Build VCV Rack Plugin (Windows)

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # MSYS2 in MINGW64 mode (required for Rack deps)
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            base-devel
            git
            wget
            unzip
            tar
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libtool

      - name: Clone Rack
        shell: msys2 {0}
        run: |
          git clone --recursive https://github.com/VCVRack/Rack.git rack

      # Builds jansson, glew, rtaudio, speexdsp, etc.
      - name: Build Rack dependencies
        shell: msys2 {0}
        run: |
          make -C rack dep

      # REQUIRED: builds libRack
      - name: Build Rack
        shell: msys2 {0}
        run: |
          make -C rack

      - name: Build plugin
        shell: msys2 {0}
        run: |
          export RACK_DIR=$PWD/rack
          make
