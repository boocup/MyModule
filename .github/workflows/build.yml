name: Build VCV Rack Plugin

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Clone Rack
        run: |
          git clone --recursive https://github.com/VCVRack/Rack.git rack

      # Build Rack dependencies (jansson, glew, rtaudio, etc.)
      - name: Build Rack dependencies
        run: |
          make -C rack dep

      # REQUIRED: build Rack itself (creates libRack)
      - name: Build Rack
        run: |
          make -C rack

      - name: Build plugin
        run: |
          export RACK_DIR=$PWD/rack
          make
